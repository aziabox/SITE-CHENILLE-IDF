<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" width="960" height="460">
  <title>Comparaison des nids et des chenilles processionnaires du pin et du chêne</title>
  <rect width="960" height="460" fill="#F7F4EC"/>
  <line x1="480" y1="30" x2="480" y2="430" stroke="#D9DFD6" stroke-width="1"/>

  <!-- Colonne pin -->
  <text x="48" y="54" font-family="Georgia,serif" font-size="22" fill="#132C21">Processionnaire du pin</text>
  <text x="48" y="78" font-family="system-ui,sans-serif" font-size="14" fill="#48584F">Thaumetopoea pityocampa</text>
  <g>
    <path d="M150 380V150" stroke="#255139" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M150 210 90 176M150 210l60-34M150 268 86 240M150 268l64-28" stroke="#255139" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="#3D8560"><ellipse cx="150" cy="140" rx="56" ry="30"/><ellipse cx="96" cy="188" rx="44" ry="24"/>
    <ellipse cx="206" cy="184" rx="44" ry="24"/><ellipse cx="90" cy="250" rx="40" ry="22"/></g>
    <ellipse cx="212" cy="168" rx="26" ry="21" fill="#FFFFFF" stroke="#BFC9BD" stroke-width="1.5"/>
    <path d="M196 156q16 7 32 0M194 168q18 8 36 0M198 180q14 6 28 0" stroke="#D9DFD6" stroke-width="1.2" fill="none"/>
    <line x1="238" y1="168" x2="300" y2="140" stroke="#B0552F" stroke-width="1.5"/>
    <text x="306" y="136" font-family="system-ui,sans-serif" font-size="14" fill="#B0552F">nid blanc, volumineux,</text>
    <text x="306" y="154" font-family="system-ui,sans-serif" font-size="14" fill="#B0552F">en bout de branche ensoleillée</text>
  </g>
  <text x="48" y="330" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">Arbre : pins (sylvestre, noir, maritime), cèdres</text>
  <text x="48" y="354" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">Chenilles visibles : automne → printemps</text>
  <text x="48" y="378" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">Descente au sol en procession : fin d'hiver</text>
  <text x="48" y="402" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">Couleur : brun-gris, flancs orangés, poils clairs</text>

  <!-- Colonne chene -->
  <text x="528" y="54" font-family="Georgia,serif" font-size="22" fill="#132C21">Processionnaire du chêne</text>
  <text x="528" y="78" font-family="system-ui,sans-serif" font-size="14" fill="#48584F">Thaumetopoea processionea</text>
  <g>
    <path d="M660 380V160" stroke="#255139" stroke-width="12" fill="none" stroke-linecap="round"/>
    <g fill="#3D8560"><circle cx="660" cy="140" r="52"/><circle cx="608" cy="172" r="36"/>
    <circle cx="712" cy="170" r="38"/><circle cx="636" cy="108" r="30"/></g>
    <path d="M652 232q18-9 20 17 1 26-20 30-8-24 0-47Z" fill="#FFFFFF" stroke="#BFC9BD" stroke-width="1.5"/>
    <line x1="676" y1="250" x2="742" y2="226" stroke="#B0552F" stroke-width="1.5"/>
    <text x="748" y="222" font-family="system-ui,sans-serif" font-size="14" fill="#B0552F">nid plat, gris sale,</text>
    <text x="748" y="240" font-family="system-ui,sans-serif" font-size="14" fill="#B0552F">plaqué sur le tronc</text>
    <text x="748" y="258" font-family="system-ui,sans-serif" font-size="14" fill="#B0552F">ou une grosse branche</text>
  </g>
  <text x="528" y="330" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">Arbre : chênes (pédonculé, sessile, rouge)</text>
  <text x="528" y="354" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">Chenilles visibles : printemps → début d'été</text>
  <text x="528" y="378" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">Pas de descente au sol : nymphose dans le nid</text>
  <text x="528" y="402" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">Couleur : grise, bande dorsale sombre</text>
</svg>
