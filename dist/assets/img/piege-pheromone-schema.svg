<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" width="960" height="380">
  <title>Schéma d'un piège à phéromone pour papillons de processionnaire du pin</title>
  <rect width="960" height="380" fill="#F7F4EC"/>
  <text x="50" y="46" font-family="Georgia,serif" font-size="20" fill="#132C21">Piège à phéromone : capturer les papillons mâles en été</text>

  <!-- entonnoir -->
  <g transform="translate(300,90)">
    <path d="M-90 0h180l-56 86H-34Z" fill="#3D8560" opacity=".9"/>
    <path d="M-90 0h180" stroke="#132C21" stroke-width="2"/>
    <ellipse cx="0" cy="-4" rx="90" ry="14" fill="#255139"/>
    <rect x="-8" y="-40" width="16" height="36" fill="#B0552F"/>
    <text x="24" y="-24" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">capsule de phéromone</text>
    <path d="M-34 86h68v70q0 16-34 16t-34-16Z" fill="#EDE7D9" stroke="#48584F" stroke-width="2"/>
    <text x="52" y="140" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">bac de capture</text>
  </g>

  <!-- papillons -->
  <g fill="#48584F" opacity=".85">
    <path d="M640 120q-18-16-34-4 12 16 34 4Zm0 0q18-16 34-4-12 16-34 4Z"/>
    <path d="M700 176q-16-14-30-3 10 14 30 3Zm0 0q16-14 30-3-10 14-30 3Z"/>
    <path d="M598 196q-14-12-26-3 9 12 26 3Zm0 0q14-12 26-3-9 12-26 3Z"/>
  </g>
  <path d="M600 130q-80 10-124 24" fill="none" stroke="#B0552F" stroke-width="1.6" stroke-dasharray="5 5"/>
  <text x="600" y="240" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">les mâles suivent la phéromone</text>
  <text x="600" y="258" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">de synthèse et sont piégés</text>

  <path d="M60 320h840" stroke="#D9DFD6" stroke-width="2"/>
  <text x="60" y="350" font-family="system-ui,sans-serif" font-size="13" fill="#48584F">Outil de suivi et de réduction de population : il mesure la pression du vol et limite les pontes, sans remplacer l'échenillage d'un nid déjà installé.</text>
</svg>
