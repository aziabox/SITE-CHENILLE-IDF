<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" width="960" height="420">
  <title>Principe de l'échenillage mécanique d'un nid de chenilles processionnaires</title>
  <rect width="960" height="420" fill="#F7F4EC"/>
  <!-- arbre -->
  <path d="M300 380V120" stroke="#255139" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M300 200 220 156M300 180l86-48M300 262 226 222" stroke="#255139" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="#3D8560" opacity=".9">
    <ellipse cx="300" cy="110" rx="70" ry="34"/><ellipse cx="216" cy="150" rx="52" ry="26"/>
    <ellipse cx="392" cy="128" rx="52" ry="26"/><ellipse cx="220" cy="216" rx="46" ry="24"/>
  </g>
  <!-- nid cible -->
  <ellipse cx="388" cy="116" rx="28" ry="22" fill="#FFFFFF" stroke="#BFC9BD" stroke-width="1.5"/>
  <circle cx="388" cy="116" r="44" fill="none" stroke="#B0552F" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- perche telescopique + echenilloir -->
  <line x1="560" y1="330" x2="404" y2="132" stroke="#48584F" stroke-width="7" stroke-linecap="round"/>
  <line x1="560" y1="330" x2="404" y2="132" stroke="#BFC9BD" stroke-width="2.5" stroke-dasharray="26 14"/>
  <path d="M404 132 386 108l22-6" fill="none" stroke="#16211B" stroke-width="4" stroke-linecap="round"/>

  <!-- operateur protege -->
  <g stroke="#132C21" stroke-width="3.5" fill="none" stroke-linecap="round">
    <circle cx="596" cy="256" r="20" fill="#255139" stroke="none"/>
    <path d="M576 250h40" stroke="#F7F4EC" stroke-width="3"/>
    <path d="M596 276v56M596 296l-36 34M596 296l40 34M596 332l-22 48M596 332l24 48"/>
  </g>
  <text x="640" y="250" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">combinaison intégrale,</text>
  <text x="640" y="268" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">gants, masque et lunettes</text>

  <!-- sac de confinement -->
  <path d="M700 380v-56q0-22 26-22h44q26 0 26 22v56Z" fill="#255139"/>
  <path d="M700 324h96" stroke="#F7F4EC" stroke-width="2"/>
  <text x="700" y="404" font-family="system-ui,sans-serif" font-size="14" fill="#16211B">sac fermé → destruction</text>

  <text x="60" y="52" font-family="Georgia,serif" font-size="20" fill="#132C21">Échenillage : le nid est coupé, confiné, puis évacué</text>
  <text x="60" y="76" font-family="system-ui,sans-serif" font-size="14" fill="#48584F">Le nid n'est jamais laissé au sol : les poils urticants y restent actifs longtemps.</text>
  <path d="M60 380h880" stroke="#D9DFD6" stroke-width="2"/>
</svg>
